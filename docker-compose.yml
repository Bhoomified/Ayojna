# Local infrastructure. Start with:  docker compose up -d
services:
  minio:            # S3-compatible object storage: our real storage tiers
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ayojna}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-please}
    volumes: ["minio-data:/data"]
  redis:            # supervisor state: lease, checkpoints, result store
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  minio-data:
